<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>小窗专注（compact）形态 demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", sans-serif;
    background: #2b2f33 url('') ; color: #333;
    min-height: 100vh; position: relative;
  }
  /* 模拟桌面背景上的其他软件（说明小窗浮在上面） */
  .fake-app {
    position: absolute; inset: 30px 30px 60px 30px;
    background: #3a3f45; border-radius: 10px;
    padding: 20px; color: #889;
    font-size: 14px; line-height: 2;
  }
  .fake-app b { color: #aab; }
  .taskbar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 48px;
    background: #1f2327; display: flex; align-items: center; padding: 0 12px; gap: 8px;
  }
  .taskbar .ic { width: 34px; height: 34px; border-radius: 6px; background: #3a4149; }
  .taskbar .ic.tomato { background: #e74c3c; }

  /* ===== ★ 小窗专注挂件 ===== */
  .widget {
    position: absolute; right: 60px; bottom: 80px;
    width: 240px; height: 240px;
    background: #161210; border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,.6), 0 0 0 1px #3a322b;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    z-index: 99;
    animation: pop .35s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .w-task { color: #9a8f85; font-size: 12px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .w-time {
    font-size: 56px; font-weight: 800; color: #faf5f0;
    font-variant-numeric: tabular-nums; line-height: 1;
  }
  .w-time .accent { color: #e74c3c; }
  .w-btns { display: flex; gap: 8px; }
  .wbtn { background: #2a231e; color: #c9beb4; border: 1px solid #3a322b; border-radius: 999px; padding: 6px 16px; font-size: 12px; cursor: pointer; }
  .wbtn.primary { background: #e74c3c; border-color: #e74c3c; color: #fff; font-weight: 700; }
  .w-close {
    position: absolute; top: 8px; right: 10px; color: #6b6058;
    font-size: 14px; cursor: pointer;
  }
  .w-close:hover { color: #e74c3c; }
  .w-always { position: absolute; top: 8px; left: 12px; color: #6b6058; font-size: 11px; }

  .tip {
    position: absolute; top: 6px; left: 12px; right: 12px; z-index: 100;
    color: #ddd; font-size: 13px; background: rgba(0,0,0,.5);
    padding: 8px 12px; border-radius: 8px;
  }
  .tip b { color: #ff8a75; }
</style>
</head>
<body>
  <div class="tip">深色背景 = 你正在用的其他软件。小窗 <b>240×240 置顶挂件</b>浮在一切之上（demo 里点 ✕ 收起 / 再点任务栏红图标唤出）</div>

  <!-- 模拟其他软件 -->
  <div class="fake-app">
    <b>这是你正在干活的软件（编辑器/浏览器/文档……）</b><br>
    小窗专注的存在意义：不用切回来，余光瞟右下角就知道还剩几分钟。<br>
    只有独立窗口能做到"置顶 + 缩小"，所以 compact 保留独立窗口实现。<br><br>
    —— 干活中 ——
  </div>
  <div class="taskbar">
    <span class="ic"></span><span class="ic"></span><span class="ic"></span>
    <span class="ic tomato" title="番茄TODO（主窗口在任务栏待命）" onclick="showWidget()"></span>
    <span class="ic"></span><span class="ic"></span>
  </div>

  <!-- ★ 小窗专注挂件 -->
  <div class="widget" id="widget">
    <span class="w-always">📌 置顶</span>
    <span class="w-close" onclick="hideWidget()">✕</span>
    <div class="w-task">正在专注 · 完成周报初稿</div>
    <div class="w-time">25<span class="accent">:</span>00</div>
    <div class="w-btns">
      <button class="wbtn primary">⏸ 暂停</button>
      <button class="wbtn">跳过</button>
    </div>
    <div style="color:#6b6058;font-size:10px">跳过 = 提前结束本番茄 · ✕ = 收起小窗（计时继续）</div>
  </div>

<script>
  function hideWidget() { document.getElementById('widget').style.display = 'none' }
  function showWidget() {
    const w = document.getElementById('widget')
    w.style.display = 'flex'
    w.style.animation = 'none'; w.offsetHeight; w.style.animation = ''
  }
</script>
</body>
</html>
