<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方案B · 极简专注风（深色 · 计时横条）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
  body { background:#211d1a; display:flex; flex-direction:column; align-items:center; padding:24px; min-height:100vh; }
  .banner { margin-bottom:16px; color:#8a837c; font-size:13px; }
  .banner b { color:#ff6b5b; }
  .win { width:920px; height:640px; background:#161210; border-radius:12px; overflow:hidden;
         box-shadow:0 20px 60px rgba(0,0,0,.5); display:flex; flex-direction:column; }
  /* 标题栏 */
  .titlebar { height:44px; display:flex; align-items:center; padding:0 16px; gap:10px; flex-shrink:0; }
  .titlebar .tomato { width:20px; height:20px; border-radius:50%;
              background:radial-gradient(circle at 35% 35%,#ff6b5b,#e74c3c); position:relative; }
  .titlebar .tomato::before { content:""; position:absolute; top:-3px; left:8px; width:5px; height:4px; background:#4a7c59; border-radius:2px; }
  .titlebar .name { font-weight:600; color:#f0e9e2; font-size:14px; }
  .titlebar .spacer { flex:1; }
  .tbtn { width:26px; height:26px; border-radius:6px; display:flex; align-items:center; justify-content:center;
          color:#6d655d; font-size:13px; }
  .tbtn:hover { background:#241e1a; }
  /* 顶部：计时横条（全宽，像"正在播放"条但没有唱片感） */
  .timer-band { padding:26px 36px 24px; border-bottom:1px solid #241e1a;
                display:flex; align-items:center; gap:28px; }
  .big-time { font-size:84px; font-weight:200; color:#faf5f0; letter-spacing:3px;
              font-variant-numeric:tabular-nums; line-height:.95; }
  .big-time .mode-tag { display:block; font-size:12px; font-weight:400; letter-spacing:4px;
                        color:#ff6b5b; margin-bottom:8px; }
  .band-right { margin-left:auto; display:flex; flex-direction:column; align-items:flex-end; gap:14px; }
  .now-task { font-size:13px; color:#8a837c; }
  .now-task b { color:#f0e9e2; }
  .ctl-row { display:flex; gap:10px; align-items:center; }
  .start { height:42px; padding:0 30px; border-radius:21px; background:#e74c3c; color:#fff;
           font-size:14px; font-weight:600; display:flex; align-items:center;
           box-shadow:0 6px 18px rgba(231,76,60,.3); }
  .ghost { height:42px; padding:0 18px; border-radius:21px; border:1px solid #3a322c;
           color:#8a837c; font-size:13px; display:flex; align-items:center; }
  /* 下方两栏：任务 | 统计 */
  .cols { flex:1; display:flex; min-height:0; }
  .col-tasks { width:400px; border-right:1px solid #241e1a; padding:20px 24px; display:flex; flex-direction:column; }
  .col-stats { flex:1; padding:20px 28px; }
  .col-head { font-size:12px; letter-spacing:2px; color:#6d655d; margin-bottom:16px; }
  .task { display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid #1f1915; }
  .task .dot { width:8px; height:8px; border-radius:50%; background:#3a322c; flex-shrink:0; }
  .task.on .dot { background:#e74c3c; box-shadow:0 0 8px rgba(231,76,60,.6); }
  .task .n { font-size:14px; color:#d8d0c6; flex:1; }
  .task.on .n { color:#faf5f0; font-weight:600; }
  .task .p { font-size:11.5px; color:#6d655d; }
  /* 统计：大数字网格 + 热力图 */
  .stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px 24px; margin-bottom:24px; }
  .stat .v { font-size:30px; font-weight:600; color:#faf5f0; font-variant-numeric:tabular-nums; }
  .stat .v small { font-size:13px; color:#8a837c; font-weight:400; }
  .stat .k { font-size:12px; color:#6d655d; margin-top:3px; }
  .heat .grid { display:grid; grid-template-columns:repeat(18,15px); gap:4px; }
  .heat .c { width:15px; height:15px; border-radius:4px; background:#241e1a; }
  .heat .c.l1 { background:#4a2420; } .heat .c.l2 { background:#7e352c; }
  .heat .c.l3 { background:#c04738; } .heat .c.l4 { background:#ff6b5b; }
  .heat .cap { font-size:11.5px; color:#6d655d; margin-top:10px; }
</style>
</head>
<body>
<div class="banner"><b>方案 B</b> · 极简专注风 —— 深色、超大数字计时横条、留白 · 920×640</div>
<div class="win">
  <div class="titlebar">
    <div class="tomato"></div><div class="name">番茄TODO</div>
    <div class="spacer"></div>
    <div class="tbtn">☀</div><div class="tbtn">⚙</div><div class="tbtn">─</div><div class="tbtn">▢</div><div class="tbtn">✕</div>
  </div>
  <div class="timer-band">
    <div class="big-time"><span class="mode-tag">FOCUS</span>24:38</div>
    <div class="band-right">
      <div class="now-task">正在专注 · <b>算法题 · 动态规划</b></div>
      <div class="ctl-row"><div class="ghost">↺ 重置</div><div class="ghost">⏭ 跳过</div><div class="start">⏸ 暂停</div></div>
    </div>
  </div>
  <div class="cols">
    <div class="col-tasks">
      <div class="col-head">今日任务 · 3/8</div>
      <div class="task on"><div class="dot"></div><div class="n">算法题 · 动态规划</div><div class="p">2 番茄</div></div>
      <div class="task"><div class="dot"></div><div class="n">写周报</div><div class="p">1 番茄</div></div>
      <div class="task"><div class="dot"></div><div class="n">背单词 50 个</div><div class="p">0</div></div>
      <div class="task"><div class="dot"></div><div class="n" style="color:#5a524a">送外卖 ✓</div><div class="p">5 番茄</div></div>
    </div>
    <div class="col-stats">
      <div class="col-head">数据</div>
      <div class="stat-grid">
        <div class="stat"><div class="v">3<small> / 8</small></div><div class="k">今日番茄 · 目标</div></div>
        <div class="stat"><div class="v">30<small> 天</small></div><div class="k">连续记录</div></div>
        <div class="stat"><div class="v">382</div><div class="k">累计番茄</div></div>
        <div class="stat"><div class="v">157.5<small> h</small></div><div class="k">累计专注</div></div>
      </div>
      <div class="heat">
        <div class="grid">
          <div class="c l1"></div><div class="c"></div><div class="c l3"></div><div class="c l2"></div>
          <div class="c"></div><div class="c l4"></div><div class="c l2"></div><div class="c l1"></div>
          <div class="c l3"></div><div class="c l2"></div><div class="c"></div><div class="c l1"></div>
          <div class="c l4"></div><div class="c l3"></div><div class="c l2"></div><div class="c l1"></div>
          <div class="c l3"></div><div class="c l4"></div>
        </div>
        <div class="cap">近三周 · 每格一天</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
