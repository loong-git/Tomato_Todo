<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>番茄 Icon 对比 Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', -apple-system, 'Segoe UI', sans-serif;
    background: #161210;
    color: #f5f0e8;
    padding: 40px 48px;
  }
  h1 { font-size: 20px; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #8a827a; margin-bottom: 32px; }
  .cap { font-size: 13px; color: #b8afa5; margin: 0 0 8px; }
  .cap small { color: #6b625a; }

  .tcard2 {
    background: rgba(31, 25, 21, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 26px;
    display: flex; flex-direction: column; gap: 8px;
    max-width: 420px;
  }
  .l1 { display: flex; align-items: center; gap: 8px; }
  .nm2 { font-size: 14px; font-weight: 600; }
  .l2 { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #8a827a; }

  /* ===== 新版：内联 SVG 番茄（取自应用 icon.svg 形象） ===== */
  .ticon {
    width: 13px; height: 13px;
    flex-shrink: 0;
    display: inline-block;
    vertical-align: -2px;
  }
  .ticon.lg { width: 15px; height: 15px; vertical-align: -3px; }
  .meta-gap { margin-left: 7px; }
  .nm-done { color: #8a827a; text-decoration: line-through; }
</style>
</head>
<body>
  <h1>任务卡番茄 Icon · Emoji → 内联 SVG</h1>
  <p class="sub">SVG 直接取自应用图标 <b>icon.svg</b> 的番茄形象（红渐变 + 绿萼片），矢量绘制、任意尺寸不糊、深浅主题通用</p>

  <p class="cap">现状 · Emoji 🍅 <small>（各平台渲染不一致，与自绘图标形象不统一）</small></p>
  <div class="tcard2">
    <div class="l1"><span class="nm2">写周报</span></div>
    <div class="l2"><span>🍅 ×2</span><span> · </span><span>14:46 创建</span></div>
  </div>

  <p class="cap">新版 · 内联 SVG 番茄 icon（13px）</p>
  <div class="tcard2">
    <div class="l1"><span class="nm2">写周报</span></div>
    <div class="l2">
      <svg class="ticon" viewBox="0 0 64 64"><defs><radialGradient id="tg1" cx="35%" cy="35%" r="65%"><stop offset="0%" stop-color="#ff6b5b"/><stop offset="100%" stop-color="#e74c3c"/></radialGradient></defs><ellipse cx="32" cy="38" rx="26" ry="24" fill="url(#tg1)"/><ellipse cx="23" cy="31" rx="9" ry="7" fill="rgba(255,255,255,.35)"/><path d="M32 18 C29 11 22 11 20 15 C18 19 23 22 27 21 C29 19 30 19 32 18" fill="#4a7c59"/><path d="M32 18 C35 11 42 11 44 15 C46 19 41 22 37 21 C35 19 34 19 32 18" fill="#5a8c69"/><path d="M32 18 C31 9 36 6 38 9 C40 12 36 17 32 18" fill="#3d6b4a"/><path d="M32 18 C33 9 28 6 26 9 C24 12 28 17 32 18" fill="#4a7c59"/><rect x="30" y="15" width="4" height="5" rx="1.5" fill="#4a7c59"/></svg>
      <span>×2</span><span class="meta-gap">·</span><span>14:46 创建</span>
    </div>
  </div>

  <p class="cap">新版 · 稍大尺寸（15px）</p>
  <div class="tcard2">
    <div class="l1"><span class="nm2">写周报</span></div>
    <div class="l2">
      <svg class="ticon lg" viewBox="0 0 64 64"><defs><radialGradient id="tg2" cx="35%" cy="35%" r="65%"><stop offset="0%" stop-color="#ff6b5b"/><stop offset="100%" stop-color="#e74c3c"/></radialGradient></defs><ellipse cx="32" cy="38" rx="26" ry="24" fill="url(#tg2)"/><ellipse cx="23" cy="31" rx="9" ry="7" fill="rgba(255,255,255,.35)"/><path d="M32 18 C29 11 22 11 20 15 C18 19 23 22 27 21 C29 19 30 19 32 18" fill="#4a7c59"/><path d="M32 18 C35 11 42 11 44 15 C46 19 41 22 37 21 C35 19 34 19 32 18" fill="#5a8c69"/><path d="M32 18 C31 9 36 6 38 9 C40 12 36 17 32 18" fill="#3d6b4a"/><path d="M32 18 C33 9 28 6 26 9 C24 12 28 17 32 18" fill="#4a7c59"/><rect x="30" y="15" width="4" height="5" rx="1.5" fill="#4a7c59"/></svg>
      <span>×2</span><span class="meta-gap">·</span><span>14:46 创建</span>
    </div>
  </div>

  <p class="cap">完成态效果</p>
  <div class="tcard2">
    <div class="l1"><span class="nm-done">写周报</span><span style="margin-left:auto; font-size:11px; color:#8a827a;">已完成</span></div>
    <div class="l2">
      <svg class="ticon" viewBox="0 0 64 64" style="opacity:.75"><defs><radialGradient id="tg3" cx="35%" cy="35%" r="65%"><stop offset="0%" stop-color="#ff6b5b"/><stop offset="100%" stop-color="#e74c3c"/></radialGradient></defs><ellipse cx="32" cy="38" rx="26" ry="24" fill="url(#tg3)"/><ellipse cx="23" cy="31" rx="9" ry="7" fill="rgba(255,255,255,.35)"/><path d="M32 18 C29 11 22 11 20 15 C18 19 23 22 27 21 C29 19 30 19 32 18" fill="#4a7c59"/><path d="M32 18 C35 11 42 11 44 15 C46 19 41 22 37 21 C35 19 34 19 32 18" fill="#5a8c69"/><path d="M32 18 C31 9 36 6 38 9 C40 12 36 17 32 18" fill="#3d6b4a"/><path d="M32 18 C33 9 28 6 26 9 C24 12 28 17 32 18" fill="#4a7c59"/><rect x="30" y="15" width="4" height="5" rx="1.5" fill="#4a7c59"/></svg>
      <span>×3</span><span class="meta-gap">·</span><span>1h 05m</span><span class="meta-gap">·</span><span>14:46 创建</span>
    </div>
  </div>

  <p class="cap">历史任务卡片（同样替换）</p>
  <div class="tcard2">
    <div class="l1" style="display:flex; justify-content:space-between;">
      <span class="nm2" style="font-weight:500;">整理资料</span>
      <span class="l2" style="gap:4px;">
        <svg class="ticon" viewBox="0 0 64 64"><defs><radialGradient id="tg4" cx="35%" cy="35%" r="65%"><stop offset="0%" stop-color="#ff6b5b"/><stop offset="100%" stop-color="#e74c3c"/></radialGradient></defs><ellipse cx="32" cy="38" rx="26" ry="24" fill="url(#tg4)"/><ellipse cx="23" cy="31" rx="9" ry="7" fill="rgba(255,255,255,.35)"/><path d="M32 18 C29 11 22 11 20 15 C18 19 23 22 27 21 C29 19 30 19 32 18" fill="#4a7c59"/><path d="M32 18 C35 11 42 11 44 15 C46 19 41 22 37 21 C35 19 34 19 32 18" fill="#5a8c69"/><path d="M32 18 C31 9 36 6 38 9 C40 12 36 17 32 18" fill="#3d6b4a"/><path d="M32 18 C33 9 28 6 26 9 C24 12 28 17 32 18" fill="#4a7c59"/><rect x="30" y="15" width="4" height="5" rx="1.5" fill="#4a7c59"/></svg>
        <span>×1</span>
      </span>
    </div>
  </div>
</body>
</html>
