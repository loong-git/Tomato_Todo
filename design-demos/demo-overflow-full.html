<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>完整页面 Demo · 任务列表「显示更多」方案</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', -apple-system, 'Segoe UI', sans-serif;
    background: #0d0b0a;
    color: #f5f0e8;
    padding: 28px;
    display: flex; justify-content: center;
  }
  :root {
    --tomato: #e74c3c; --tomato-light: #ff6b5b; --tomato-dark: #c0392b;
    --bg-primary: #1a1614; --bg-secondary: #2d2522;
    --bg-card: rgba(45, 37, 34, 0.85);
    --text-primary: #faf5f0; --text-secondary: #c4bdb5; --text-muted: #8a827a;
    --border-color: rgba(168, 159, 151, 0.18);
    --shadow: rgba(0, 0, 0, 0.4);
    --task-completed-bg: rgba(255,255,255,.03);
  }

  /* ===== 应用窗口 ===== */
  .app {
    width: 1056px; height: 720px;
    background: var(--bg-primary);
    border-radius: 16px;
    overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 24px 70px rgba(0,0,0,.65);
    border: 1px solid rgba(255,255,255,.06);
  }

  /* 标题栏 */
  .title-bar {
    height: 48px; flex-shrink: 0;
    display: flex; align-items: center; gap: 8px;
    padding: 0 10px 0 16px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border-color);
  }
  .logo { display: flex; align-items: center; gap: 9px; }
  .tomato-icon { width: 26px; height: 26px; color: var(--tomato); }
  .title { font-size: 15px; font-weight: 600; }
  .title-blank { flex: 1; }
  .wbtn {
    width: 30px; height: 28px; border: none; border-radius: 6px;
    background: transparent; color: var(--text-secondary); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .wbtn:hover { background: rgba(255,255,255,.1); color: var(--text-primary); }
  .wdivider { width: 1px; height: 16px; background: var(--border-color); margin: 0 4px; }

  /* 主体网格 */
  .content {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: minmax(0,1fr) minmax(0,1fr);
    grid-template-rows: auto minmax(0,1fr) auto;
    grid-template-areas: "timer timer" "tasks stats" "heat heat";
    gap: 10px; padding: 12px 14px;
  }

  /* 计时卡 */
  .timer-area { grid-area: timer; }
  .timer-card {
    display: flex; align-items: center; gap: 14px;
    background: var(--bg-card); border: 1px solid var(--border-color);
    border-radius: 14px; padding: 12px 18px 14px;
    box-shadow: 0 2px 12px var(--shadow);
  }
  .td-num {
    font-size: 44px; font-weight: 800; color: var(--tomato);
    font-variant-numeric: tabular-nums; line-height: 1;
    position: relative; padding-left: 16px; flex-shrink: 0;
  }
  .td-num::before {
    content: ''; position: absolute; left: 0; top: 14%; bottom: 14%;
    width: 4px; border-radius: 2px; background: currentColor;
  }
  .timer-meta { flex: 1; display: flex; align-items: center; gap: 14px; min-width: 0; }
  .mode-tabs {
    display: flex; background: var(--bg-secondary); border-radius: 10px;
    padding: 3px; gap: 2px; border: 1px solid var(--border-color); flex-shrink: 0;
  }
  .mode-tab {
    padding: 3px 10px; border: none; background: transparent;
    color: var(--text-secondary); font-size: 11px; font-weight: 500;
    border-radius: 8px; cursor: pointer;
  }
  .mode-tab.active { background: var(--tomato); color: #fff; }
  .goal-slot { flex: 1; min-width: 0; padding: 0 6px; }
  .goal-line { display: flex; align-items: baseline; gap: 5px; font-size: 12.5px; color: var(--text-muted); margin-bottom: 6px; }
  .goal-line b { color: var(--text-primary); font-size: 13px; }
  .goal-pct { margin-left: auto; font-size: 11px; }
  .goal-bar { height: 4px; border-radius: 2px; background: var(--border-color); overflow: hidden; }
  .goal-bar i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--tomato-light), var(--tomato)); width: 12%; }
  .timer-ctl { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .cbtn-ghost { width: 38px; height: 38px; border-radius: 10px; border: none; background: var(--bg-secondary); color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .cbtn-ghost:hover { color: var(--text-primary); }
  .cbtn-primary {
    height: 40px; padding: 0 24px; border-radius: 20px; border: none;
    background: linear-gradient(135deg, var(--tomato-light), var(--tomato));
    color: #fff; font-size: 13.5px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; gap: 7px;
    box-shadow: 0 4px 14px rgba(231,76,60,.35);
  }

  /* 任务卡 */
  .task-list-card {
    grid-area: tasks; min-height: 0;
    display: flex; flex-direction: column;
    background: var(--bg-card); border: 1px solid var(--border-color);
    border-radius: 14px; padding: 14px 16px;
    box-shadow: 0 2px 12px var(--shadow);
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .card-head h3 { font-size: 14px; font-weight: 600; }
  .goal-badge {
    font-size: 11px; color: var(--tomato-light);
    background: rgba(231,76,60,.12); border: 1px solid rgba(231,76,60,.25);
    padding: 2px 9px; border-radius: 999px; font-weight: 600;
    display: flex; align-items: center; gap: 3px;
  }
  .dot-t { width: 9px; height: 9px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff6b5b, #e74c3c); }
  .add-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .add-input {
    flex: 1; background: rgba(0,0,0,.25); border: 1px solid var(--border-color);
    border-radius: 9px; padding: 8px 11px; color: var(--text-primary);
    font-size: 12.5px; outline: none; font-family: inherit;
  }
  .add-input::placeholder { color: var(--text-muted); }
  .add-btn {
    width: 34px; border: none; border-radius: 9px; background: var(--tomato);
    color: #fff; cursor: pointer; font-size: 17px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .date-header { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .date-header::after { content: ''; flex: 1; height: 1px; background: var(--border-color); }

  .task-list { display: flex; flex-direction: column; gap: 6px; min-height: 0; overflow-y: auto; }
  .task-list::-webkit-scrollbar { width: 5px; }
  .task-list::-webkit-scrollbar-thumb { background: rgba(231,76,60,.35); border-radius: 3px; }
  .task-list::-webkit-scrollbar-track { background: transparent; }

  .tcard2 {
    display: flex; flex-direction: column; gap: 7px;
    padding: 9px 12px; border-radius: 10px;
    border: 1px solid var(--border-color); background: var(--bg-secondary);
    flex-shrink: 0;
  }
  .tcard2.done { background: var(--task-completed-bg); border-color: transparent; }
  .l1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .l2 { display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--text-muted); }
  .cb2 { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; background: #27ae60; color: #fff; display: flex; align-items: center; justify-content: center; }
  .cb2 svg { width: 10px; height: 10px; }
  .task-name-wrapper { flex: 1; min-width: 0; }
  .nm2 { font-size: 13.5px; color: var(--text-primary); font-weight: 500; }
  .tcard2.done .nm2 { color: var(--text-muted); font-weight: 400; text-decoration: line-through; text-decoration-color: var(--border-color); }
  .meta-top { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
  .tag.ok { font-size: 10.5px; padding: 2px 9px; border-radius: 9px; flex-shrink: 0; background: rgba(39,174,96,.15); color: #6fbf83; }
  .meta { font-size: 11px; color: var(--text-muted); white-space: nowrap; display: flex; align-items: center; gap: 3px; }
  .meta.done-time { margin-left: auto; }
  .ticon { width: 13px; height: 13px; flex-shrink: 0; }
  .acts2 { margin-left: auto; display: flex; align-items: center; gap: 2px; }
  .db { width: 20px; height: 20px; border: none; border-radius: 50%; background: var(--bg-secondary); color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .dx { width: 20px; height: 20px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; border-radius: 50%; }

  /* ★ 显示更多 */
  .more-row {
    margin-top: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 11.5px; color: var(--text-muted); cursor: pointer;
    padding: 7px; border-radius: 8px; border: 1px dashed var(--border-color);
    transition: all .18s ease; user-select: none;
  }
  .more-row:hover { color: var(--tomato-light); border-color: rgba(231,76,60,.4); background: rgba(231,76,60,.05); }
  .more-row .chev { transition: transform .25s ease; }
  .more-row.open .chev { transform: rotate(180deg); }

  .hist-btn {
    margin-top: 8px; flex-shrink: 0;
    padding: 9px; border-radius: 9px; border: 1px dashed var(--border-color);
    background: transparent; color: var(--text-muted); font-size: 11.5px;
    cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .hist-btn:hover { color: var(--tomato-light); border-color: rgba(231,76,60,.4); }

  /* 统计卡 */
  .stats-card {
    grid-area: stats; min-height: 0; overflow-y: auto;
    background: var(--bg-card); border: 1px solid var(--border-color);
    border-radius: 14px; padding: 12px 14px;
    display: flex; flex-direction: column; gap: 9px;
    box-shadow: 0 2px 12px var(--shadow);
  }
  .stats-head { display: flex; align-items: center; gap: 8px; }
  .stats-head h3 { font-size: 14px; font-weight: 600; flex: 1; }
  .mini-btn { font-size: 11px; color: var(--text-muted); background: transparent; border: 1px solid var(--border-color); border-radius: 7px; padding: 3px 9px; cursor: pointer; }
  .goal-box { background: rgba(0,0,0,.2); border-radius: 10px; padding: 10px 12px; }
  .goal-box .row { display: flex; align-items: baseline; gap: 6px; font-size: 12px; color: var(--text-muted); }
  .goal-box .row b { font-size: 19px; color: var(--tomato); }
  .goal-box .pct { margin-left: auto; font-size: 11px; color: var(--tomato-light); background: rgba(231,76,60,.12); padding: 2px 8px; border-radius: 999px; }
  .week { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; padding: 6px 0; }
  .wd { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--text-muted); flex: 1; }
  .wd .bar { width: 22px; border-radius: 4px; background: rgba(255,255,255,.06); height: 44px; display: flex; align-items: flex-end; }
  .wd .bar i { display: block; width: 100%; border-radius: 4px; background: var(--tomato); }
  .wd .bar.on i { height: 100%; }
  .wd.today { color: var(--tomato-light); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .cell { background: rgba(0,0,0,.2); border-radius: 10px; padding: 9px 11px; }
  .cell b { font-size: 17px; display: block; margin-bottom: 2px; }
  .cell span { font-size: 11px; color: var(--text-muted); }

  /* 热力条 */
  .heat-strip {
    grid-area: heat;
    background: var(--bg-card); border: 1px solid var(--border-color);
    border-radius: 14px; padding: 10px 14px;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 2px 12px var(--shadow);
  }
  .heat-strip .lbl { font-size: 12px; font-weight: 600; flex-shrink: 0; }
  .heat-strip .lbl small { display: block; font-size: 10px; color: var(--text-muted); font-weight: 400; }
  .cells { display: flex; gap: 3px; flex: 1; }
  .cell-h { width: 16px; height: 20px; border-radius: 4px; background: rgba(255,255,255,.05); }
  .cell-h.h1 { background: rgba(231,76,60,.3); } .cell-h.h2 { background: rgba(231,76,60,.55); }
  .cell-h.h3 { background: var(--tomato); } .cell-h.h4 { background: var(--tomato-dark); }
  .heat-strip .sum { font-size: 11.5px; color: var(--text-muted); flex-shrink: 0; }
  .heat-strip .sum b { color: var(--text-primary); }

  /* 提示条 */
  .tip {
    position: fixed; left: 24px; bottom: 20px;
    background: rgba(231,76,60,.12); border: 1px solid rgba(231,76,60,.35);
    color: #ffb3a8; padding: 10px 16px; border-radius: 10px; font-size: 12px;
    max-width: 300px; line-height: 1.6;
  }
  .tip b { color: var(--tomato-light); }
</style>
</head>
<body>
  <div class="app">
    <!-- 标题栏 -->
    <div class="title-bar">
      <div class="logo">
        <svg class="tomato-icon" viewBox="0 0 32 32">
          <ellipse cx="16" cy="18" rx="12" ry="11" fill="currentColor" opacity="0.9"/>
          <path d="M16 7 C14 4 12 4 11 5 C10 6 10 8 12 9 L16 7 L20 9 C22 8 22 6 21 5 C20 4 18 4 16 7Z" fill="#4a7c59"/>
        </svg>
        <span class="title">番茄TODO</span>
      </div>
      <div class="title-blank"></div>
      <button class="wbtn" title="切换浅色模式"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button>
      <button class="wbtn" title="小窗专注"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><rect x="12" y="12" width="6" height="4.5" rx="1" fill="currentColor" stroke="none"/></svg></button>
      <button class="wbtn" title="沉浸模式"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></svg></button>
      <button class="wbtn" title="设置"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
      <div class="wdivider"></div>
      <button class="wbtn" title="最小化"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
      <button class="wbtn" title="最大化"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="1.5"/></svg></button>
      <button class="wbtn" title="关闭"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>

    <div class="content">
      <!-- 计时卡 -->
      <section class="timer-area">
        <div class="timer-card">
          <div class="td-num">25:00</div>
          <div class="timer-meta">
            <div class="mode-tabs">
              <button class="mode-tab active">专注</button>
              <button class="mode-tab">短休息</button>
              <button class="mode-tab">长休息</button>
            </div>
            <div class="goal-slot">
              <div class="goal-line"><b>1</b>/8 个番茄<span class="goal-pct">12%</span></div>
              <div class="goal-bar"><i></i></div>
            </div>
          </div>
          <div class="timer-ctl">
            <button class="cbtn-ghost"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
            <button class="cbtn-primary"><svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>开始</button>
            <button class="cbtn-ghost"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4" fill="currentColor"/><line x1="19" y1="5" x2="19" y2="19" stroke-linecap="round"/></svg></button>
          </div>
        </div>
      </section>

      <!-- 任务卡 -->
      <div class="task-list-card">
        <div class="card-head">
          <h3>今日任务</h3>
          <span class="goal-badge"><span class="dot-t"></span>1/8</span>
        </div>
        <div class="add-row">
          <input class="add-input" placeholder="添加新任务...（N）">
          <button class="add-btn">+</button>
        </div>
        <div class="date-header">今天</div>
        <div class="task-list" id="list"></div>
        <div class="more-row" id="more" onclick="toggle()">
          <span id="more-text">显示更多 (4)</span>
          <svg class="chev" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <button class="hist-btn">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          历史任务 (15)
        </button>
      </div>

      <!-- 统计卡 -->
      <div class="stats-card">
        <div class="stats-head">
          <h3>数据</h3>
          <button class="mini-btn">↓ 数据</button>
          <button class="mini-btn">≡ 详细数据</button>

        <div class="goal-box">
          <div class="row"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--tomato)" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>今日目标<b>0.4</b>/4 小时<span class="pct">10.4%</span></div>

        <div class="week">
          <div class="wd"><span>0</span><div class="bar"></div><span>一</span></div>

          <div class="wd today"><span>1</span><div class="bar on"><i></i></div><span>四</span></div>
          <div class="wd"><span>0</span><div class="bar"></div><span>五</span></div>
          <div class="wd"><span>0</span><div class="bar"></div><span>六</span></div>
          <div class="wd"><span>0</span><div class="bar"></div><span>日</span></div>
        </div>
        <div class="two">
          <div class="cell"><b>25</b><span>分钟</span></div>
          <div class="cell"><b>1/8</b><span>完成番茄</span></div>
          <div class="cell"><b>1天</b><span>连续记录</span></div>
          <div class="cell"><b>0.42</b><span>昨日小时</span></div>

      </div>

      <!-- 热力条 -->
      <div class="heat-strip">
        <div class="lbl">专注热力<small>9月 · 每格一天</small></div>
        <div class="cells">
          <div class="cell-h h3"></div><div class="cell-h h4"></div><div class="cell-h h3"></div>

          <div class="cell-h h1"></div><div class="cell-h"></div><div class="cell-h h1"></div>
          <div class="cell-h h2"></div><div class="cell-h h1"></div><div class="cell-h"></div>
          <div class="cell-h h3"></div><div class="cell-h h1"></div><div class="cell-h h2"></div>
        </div>
        <div class="sum">本月 <b>30</b> 个番茄 · <b>12.5</b> 小时　　完整日历 ›</div>
      </div>
    </div>
  </div>

  <div class="tip">
    <b>体验重点：</b>点任务列表底部的「显示更多 (4)」→ 原地展开全部 7 条；再点收起。<br>
    注意右侧统计卡和底部热力条<b>不会被挤出</b>（列表区独立滚动兜底）。
  </div>

<script>
const TASKS = [
  { name: 'test',   done: true,  time: '17:20' },
  { name: 'test',   done: true,  time: '17:09' },
  { name: '测试事件', done: true,  time: '17:00' },
  { name: 'test2',  done: true,  time: '16:44' },
  { name: 'test',   done: true,  time: '16:41' },
  { name: '写周报',  done: false, time: '14:31' },
  { name: '整理资料', done: false, time: '10:05' }
];
const TOMATO = '<svg class="ticon" viewBox="0 0 64 64"><ellipse cx="32" cy="38" rx="26" ry="24" fill="#e74c3c"/><path d="M32 18 C29 11 22 11 20 15 C18 19 23 22 27 21 C29 19 30 19 32 18" fill="#4a7c59"/><path d="M32 18 C35 11 42 11 44 15 C46 19 41 22 37 21 C35 19 34 19 32 18" fill="#5a8c69"/><rect x="30" y="15" width="4" height="5" rx="1.5" fill="#4a7c59"/></svg>';

function card(t) {
  if (t.done) return `<div class="tcard2 done">
    <div class="l1">
      <div class="cb2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div class="task-name-wrapper"><span class="nm2">${t.name}</span></div>
      <span class="tag.ok">已完成</span>
    </div>
    <div class="l2"><span class="meta">${TOMATO}×0</span><span class="meta done-time">完成于 ${t.time}</span></div>
  </div>`;
  return `<div class="tcard2">
    <div class="l1">
      <div class="task-name-wrapper"><span class="nm2">${t.name}</span></div>
      <span class="meta-top">创建于 ${t.time}</span>
    </div>
    <div class="l2">
      <span class="meta">${TOMATO}×0</span>
      <div class="acts2">
        <button class="db"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg></button>
        <button class="dx">×</button>
      </div>
    </div>
  </div>`;
}

const DEFAULT_SHOW = 3;
let open = false;
function render() {
  const show = open ? TASKS : TASKS.slice(0, DEFAULT_SHOW);
  document.getElementById('list').innerHTML = show.map(card).join('');
  document.getElementById('more-text').textContent = open ? '收起' : `显示更多 (${TASKS.length - DEFAULT_SHOW})`;
  document.getElementById('more').classList.toggle('open', open);
}
function toggle() { open = !open; render(); }
render();
</script>
</body>
</html>
